    <script>
      // Global guard to safely intercept Google Maps API activation errors and prevent unhandled browser exceptions
      window.__gmAuthFailed = false;
      window.gm_authFailure = function() {
        window.__gmAuthFailed = true;
        window.dispatchEvent(new CustomEvent('google-maps-auth-failure'));
      };
      const origConsoleError = console.error;
      console.error = function(...args) {
        if (args.some(arg => typeof arg === 'string' && (arg.includes('ApiNotActivatedMapError') || arg.includes('google.maps')))) {
          return;
        }
        origConsoleError.apply(console, args);
      };
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (
            e.message.indexOf('Illegal constructor') !== -1 ||
            e.message.indexOf('ApiNotActivatedMapError') !== -1 ||
            e.message.indexOf('google.maps') !== -1
          )) ||
          (e.filename && e.filename.indexOf('maps.googleapis.com') !== -1)
        )) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
